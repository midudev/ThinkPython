# Book settings
title: Think Python (edición en español)
author: Allen B. Downey

latex:
  latex_documents:
    targetname: book.tex

execute:
  execute_notebooks: 'off'

repository:
  url: https://github.com/AllenDowney/ThinkPython/tree/v3
html:
  use_repository_button: true

  extra_footer: |
    <div style="text-align: left;">
      <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
        <img alt="Licencia Creative Commons" style="border-width:0"
             src="https://i.creativecommons.org/l/by-nc-sa/4.0/88x31.png" />
      </a>
      <br />
      Esta obra está bajo una
      <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
        Licencia Creative Commons Atribución-NoComercial-CompartirIgual 4.0 Internacional
      </a>.
      <br />
      Traducción al español por midudev (Miguel Ángel Durán). Obra original de Allen B. Downey.
    </div>

parse:
  # myst_extended_syntax: true  # instead enable individual features below
  myst_enable_extensions:  # https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - amsmath
    # - attrs_inline  # causing the conflict with dollarmath
    - colon_fence
    - deflist
    - dollarmath
    - fieldlist
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - strikethrough
    - substitution
    - tasklist

sphinx:
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    mathjax_config:
      tex2jax:
        inlineMath: [["$","$"], ["\\(", "\\)"]]
    myst_update_mathjax: false
